name: agent-build

# Reusable workflow: builder agent.
#   mode=build -> implement a GitHub issue on a new agent/issue-N branch and open a PR
#   mode=fix   -> address gate failures / reviewer comments on an existing PR
# Either way it finishes by dispatching agent-review for the PR.

on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      issue_number:
        type: number
        default: 0
      pr_number:
        type: number
        default: 0
      feedback_run_id:
        description: Run ID of the agent-review run whose feedback artifacts to fix
        type: string
        default: ""
      pipeline_repo:
        type: string
        required: true
      pipeline_ref:
        type: string
        default: v1
      config_path:
        type: string
        default: .agent-pipeline.yml
      caller_workflow:
        type: string
        default: agent.yml
    secrets:
      ANTHROPIC_API_KEY:
        required: true
      PIPELINE_REPO_TOKEN:
        required: false

env:
  PIPE: .agent-pipeline-src/scripts/pipeline.py

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      MODE: ${{ inputs.mode }}
      ISSUE: ${{ inputs.issue_number }}
      PR: ${{ inputs.pr_number }}
    steps:
      - name: Resolve branch
        id: branch
        run: |
          case "$MODE" in
            build)
              [[ "$ISSUE" -gt 0 ]] || { echo "::error::issue_number is required for mode=build"; exit 1; }
              branch="agent/issue-$ISSUE"
              if gh api "repos/$GITHUB_REPOSITORY/branches/$branch" --silent 2>/dev/null; then
                echo "::error::Branch $branch already exists. Close or merge its PR, or delete the branch, before rebuilding."
                exit 1
              fi
              base=$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef -q .defaultBranchRef.name)
              echo "checkout_ref=$base" >> "$GITHUB_OUTPUT" ;;
            fix)
              [[ "$PR" -gt 0 ]] || { echo "::error::pr_number is required for mode=fix"; exit 1; }
              branch=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefName -q .headRefName)
              echo "checkout_ref=$branch" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::mode must be build or fix"; exit 1 ;;
          esac
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.checkout_ref }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.pipeline_repo }}
          ref: ${{ inputs.pipeline_ref }}
          path: .agent-pipeline-src
          token: ${{ secrets.PIPELINE_REPO_TOKEN || github.token }}
      - name: Prepare git
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          printf '.agent-work/\n.agent-pipeline-src/\n' >> .git/info/exclude
          git config user.name "agent-pipeline[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$MODE" == "build" ]]; then git switch -c "$BRANCH"; fi
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - id: cfg
        run: python3 "$PIPE" config --path "${{ inputs.config_path }}"

      - uses: ./.agent-pipeline-src/actions/setup-toolchain
        with:
          language: ${{ steps.cfg.outputs.language }}
          version: ${{ steps.cfg.outputs.version }}
          setup: ${{ steps.cfg.outputs.setup }}

      # ---------- build mode: task comes from the issue
      - id: task
        if: inputs.mode == 'build'
        run: python3 "$PIPE" task --issue "$ISSUE"

      # ---------- fix mode: feedback comes from the review run's artifacts
      - if: inputs.mode == 'fix'
        uses: actions/download-artifact@v4
        with:
          pattern: agent-feedback-*
          merge-multiple: true
          path: .agent-work/feedback
          run-id: ${{ inputs.feedback_run_id }}
          github-token: ${{ github.token }}
      - id: round
        if: inputs.mode == 'fix'
        run: python3 "$PIPE" pr-state --pr "$PR"

      - id: render
        env:
          TPL_REPO: ${{ github.repository }}
          TPL_ISSUE_NUMBER: ${{ inputs.issue_number }}
          TPL_PR_NUMBER: ${{ inputs.pr_number }}
          TPL_BRANCH: ${{ steps.branch.outputs.name }}
          TPL_GATES: ${{ steps.cfg.outputs.gate_list }}
          TPL_MAX_ROUNDS: ${{ steps.cfg.outputs.max_rounds }}
          NEXT_ROUND: ${{ steps.round.outputs.round }}
        run: |
          # pr-state reports the NEXT round; the one that just failed is the one before it.
          if [[ -n "$NEXT_ROUND" ]]; then export TPL_ROUND=$((NEXT_ROUND - 1)); else export TPL_ROUND=1; fi
          template=builder.md
          if [[ "$MODE" == "fix" ]]; then template=fixer.md; fi
          python3 "$PIPE" render --template ".agent-pipeline-src/prompts/$template" --out .agent-work/builder-prompt.md

      - name: Builder agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          allowed_bots: github-actions[bot]
          prompt: ${{ steps.render.outputs.prompt }}
          claude_args: |
            --model ${{ steps.cfg.outputs.builder_model }}
            --max-turns ${{ steps.cfg.outputs.builder_max_turns }}
            --allowedTools "${{ steps.cfg.outputs.builder_tools }}"
            --disallowedTools "WebFetch,WebSearch,Bash(git push:*),Bash(gh:*)"

      - name: Commit, push and open PR
        id: push
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          TITLE: ${{ steps.task.outputs.title }}
        run: |
          # Commit anything the agent left uncommitted, but never pipeline scratch files.
          git add -A
          git diff --cached --quiet || git commit -m "agent: remaining changes"

          if [[ "$(git rev-parse HEAD)" == "$START_SHA" ]]; then
            target=$([[ "$MODE" == "build" ]] && echo "$ISSUE" || echo "$PR")
            gh issue comment "$target" --repo "$GITHUB_REPOSITORY" --body \
              "🤖 The builder agent finished without making changes. See the run log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "::error::Builder made no commits"
            exit 1
          fi

          # Refuse to ship workflow edits made by the agent.
          if git diff --name-only "$START_SHA" HEAD | grep -q '^\.github/'; then
            echo "::error::Builder modified .github/ - refusing to push"
            exit 1
          fi

          git push origin "HEAD:$BRANCH"

          if [[ "$MODE" == "build" ]]; then
            gh label create agent --repo "$GITHUB_REPOSITORY" --color 5319E7 \
              --description "Opened by the agent pipeline" 2>/dev/null || true
            base=$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef -q .defaultBranchRef.name)
            url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$base" --head "$BRANCH" \
              --title "[agent] $TITLE" --label agent \
              --body "Closes #$ISSUE"$'\n\n'"Implemented by the builder agent (\`${{ steps.cfg.outputs.builder_model }}\`). The reviewer agent will comment shortly."$'\n\n'"**Commits:**"$'\n'"$(git log --format='- %s' "$START_SHA..HEAD")")
            echo "pr_number=${url##*/}" >> "$GITHUB_OUTPUT"
          else
            echo "pr_number=$PR" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN don't trigger pull_request workflows,
      # so start the review explicitly (workflow_dispatch is the documented exception).
      - name: Request review
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          PR_NUMBER: ${{ steps.push.outputs.pr_number }}
        run: |
          gh workflow run "${{ inputs.caller_workflow }}" --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" \
            -f mode=review -f pr_number="$PR_NUMBER"
