[package]
name = "movie-match-server"
version = "0.1.0"
edition = "2021"
description = "Holds the TMDB API key and answers Movie Match's TMDB requests, so users don't need a key."

[[bin]]
name = "movie-match-server"
path = "src/main.rs"

[dependencies]
movie-match = { path = ".." }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
