[package]
name = "movie-match"
version = "0.1.0"
edition = "2021"
description = "Scores upcoming movie releases by how likely you are to enjoy them, based on movies you already like."

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
dotenvy = "0.15"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"

[workspace]
members = ["app"]
